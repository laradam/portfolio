<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lara Dam | Criadora de conteúdo UGC</title>
  <meta name="description" content="Portfólio de Lara Dam, criadora de conteúdo UGC. Vídeos naturais que geram confiança, desejo e vendas para a sua marca.">
  <meta name="theme-color" content="#8ec2e6">

  <!-- Fontes do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       CORES E MEDIDAS DO SITE
       Para mudar a paleta, edite só as variáveis abaixo.
       ========================================================= */
    :root {
      --limao: #d6f526;
      --ceu: #8ec2e6;
      --ceu-claro: #d5e8f5;
      --verde: #2f9e3e;
      --verde-escuro: #1c6a28;
      --creme: #f6f4e6;
      --branco: #fffef8;
      --tinta: #13230f;
      --tinta-suave: #3b4a37;

      --borda: 2.5px solid var(--tinta);
      --sombra: 6px 6px 0 var(--tinta);
      --sombra-p: 4px 4px 0 var(--tinta);
      --sombra-g: 9px 9px 0 var(--tinta);
      --raio: 20px;
      --raio-p: 12px;
      --altura-menu: 72px;

      --fonte-titulo: "Archivo Black", "Arial Black", sans-serif;
      --fonte-corpo: "Archivo", system-ui, sans-serif;
      --fonte-manuscrita: "Parisienne", cursive;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--altura-menu) + 16px); }
    body {
      margin: 0;
      font-family: var(--fonte-corpo);
      font-size: 1.0625rem;
      line-height: 1.6;
      color: var(--tinta);
      background: var(--creme);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--fonte-titulo); font-weight: 400; line-height: 1; letter-spacing: -0.01em; }
    ul { margin: 0; padding: 0; list-style: none; }
    button, input, textarea { font: inherit; color: inherit; }

    .container { width: min(1200px, 100% - 40px); margin-inline: auto; }

    /* Foco visível para quem navega pelo teclado */
    :focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; box-shadow: 0 0 0 7px var(--limao); border-radius: 6px; }

    .pular-link {
      position: absolute; left: 16px; top: -100px; z-index: 200;
      background: var(--limao); border: var(--borda); box-shadow: var(--sombra-p);
      padding: 10px 18px; border-radius: 999px; font-weight: 700; text-decoration: none;
    }
    .pular-link:focus { top: 12px; }

    .visualmente-oculto {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- Botões ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 26px; border: var(--borda); border-radius: 999px;
      font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer;
      box-shadow: var(--sombra-p); background: var(--creme);
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--tinta); }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
    .btn-limao { background: var(--limao); }
    .btn-ceu { background: var(--ceu); }
    .btn-tinta { background: var(--tinta); color: var(--limao); }
    .btn svg { width: 20px; height: 20px; flex: none; }

    /* ---------- Títulos de seção ---------- */
    .cabecalho-secao { margin-bottom: clamp(36px, 6vw, 64px); max-width: 760px; }
    .cabecalho-secao.centro { text-align: center; margin-inline: auto; }
    .manuscrito {
      display: inline-block; font-family: var(--fonte-manuscrita);
      font-size: clamp(1.9rem, 4.5vw, 2.9rem); line-height: 1; color: var(--verde-escuro);
      transform: rotate(-3deg); margin-bottom: 4px;
    }
    .titulo-secao { font-size: clamp(2.2rem, 6vw, 4.2rem); text-transform: uppercase; }
    .subtitulo-secao { margin-top: 18px; font-size: 1.125rem; color: var(--tinta-suave); }

    section { padding-block: clamp(72px, 11vw, 128px); position: relative; }

    /* ---------- Blocos em gradiente (simulam fotos e vídeos) ----------
       Cada classe abaixo é um "falso foto". Para usar foto de verdade,
       veja o comentário no CONFIG dentro do <script>. */
    .midia { width: 100%; height: 100%; object-fit: cover; position: relative; overflow: hidden; }
    .g-limao  { background: linear-gradient(140deg, #d6f526 0%, #b4e04a 45%, #8ec2e6 100%); }
    .g-ceu    { background: linear-gradient(170deg, #8ec2e6 0%, #bcd9ee 55%, #f6f4e6 100%); }
    .g-verde  { background: linear-gradient(135deg, #2f9e3e 0%, #7cc832 55%, #d6f526 100%); }
    .g-sol    { background: radial-gradient(circle at 28% 26%, #f6f4e6 0 9%, #d6f526 10% 38%, #8ec2e6 78%); }
    .g-mar    { background: linear-gradient(200deg, #8ec2e6 0%, #5fae8c 55%, #2f9e3e 100%); }
    .g-creme  { background: linear-gradient(150deg, #f6f4e6 0%, #e6f0b0 50%, #d6f526 100%); }
    .g-brisa  { background: linear-gradient(120deg, #f6f4e6 0%, #8ec2e6 60%, #2f9e3e 120%); }
    .g-pomar  { background: radial-gradient(circle at 72% 30%, #d6f526 0 18%, transparent 19%), linear-gradient(160deg, #2f9e3e, #8ec2e6); }
    /* textura de luz por cima dos gradientes */
    div.midia::after {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(circle at 80% 85%, rgba(255,255,255,.45) 0 12%, transparent 13%),
        radial-gradient(circle at 15% 80%, rgba(255,255,255,.25) 0 7%, transparent 8%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 14px);
      pointer-events: none;
    }

    /* Fita adesiva da colagem */
    .fita::before {
      content: ""; position: absolute; top: -14px; left: 50%; z-index: 3;
      width: 110px; height: 30px; transform: translateX(-50%) rotate(-4deg);
      background: rgba(246, 244, 230, .82); border: 1.5px dashed rgba(19,35,15,.35);
    }

    /* Adesivos (stickers) */
    .adesivo {
      position: absolute; z-index: 4; display: inline-block;
      background: var(--limao); border: var(--borda); box-shadow: var(--sombra-p);
      border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: .9rem; line-height: 1.2;
      white-space: nowrap;
    }

    /* =========================================================
       1. CAPA (menu + primeira dobra + faixa de marcas)
       ========================================================= */
    .topo {
      position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--altura-menu);
      background: rgba(246, 244, 230, .96); border-bottom: var(--borda);
    }
    .topo .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; font-family: var(--fonte-titulo); font-size: 1.3rem; text-transform: uppercase; white-space: nowrap; }
    .logo span { font-family: var(--fonte-manuscrita); text-transform: none; font-size: 1.6rem; color: var(--verde-escuro); }

    .nav-lista { display: flex; align-items: center; gap: 4px; }
    .nav-lista a { display: block; padding: 8px 14px; border-radius: 999px; text-decoration: none; font-weight: 600; transition: background-color .15s ease; }
    .nav-lista a:hover { background: var(--ceu-claro); }
    .nav-lista a.nav-cta { background: var(--limao); border: var(--borda); box-shadow: var(--sombra-p); margin-left: 8px; }
    .nav-lista a.nav-cta:hover { background: var(--limao); transform: translate(-1px,-1px); }

    .menu-botao {
      display: none; width: 48px; height: 48px; border: var(--borda); border-radius: 14px;
      background: var(--limao); box-shadow: var(--sombra-p); cursor: pointer; padding: 0;
      align-items: center; justify-content: center;
    }
    .menu-botao span, .menu-botao span::before, .menu-botao span::after {
      display: block; width: 22px; height: 2.5px; background: var(--tinta); border-radius: 2px; position: relative;
      transition: transform .25s ease, background-color .25s ease;
    }
    .menu-botao span::before, .menu-botao span::after { content: ""; position: absolute; left: 0; }
    .menu-botao span::before { top: -7px; }
    .menu-botao span::after { top: 7px; }
    .menu-botao[aria-expanded="true"] span { background: transparent; }
    .menu-botao[aria-expanded="true"] span::before { transform: translateY(7px) rotate(45deg); }
    .menu-botao[aria-expanded="true"] span::after { transform: translateY(-7px) rotate(-45deg); }

    .capa {
      padding-top: calc(var(--altura-menu) + clamp(40px, 7vw, 88px));
      padding-bottom: 0;
      background:
        radial-gradient(ellipse 160px 60px at 8% 22%, rgba(255,255,255,.85) 60%, transparent 62%),
        radial-gradient(ellipse 110px 46px at 13% 18%, rgba(255,255,255,.85) 60%, transparent 62%),
        radial-gradient(ellipse 190px 64px at 92% 70%, rgba(255,255,255,.7) 60%, transparent 62%),
        radial-gradient(ellipse 120px 50px at 86% 66%, rgba(255,255,255,.7) 60%, transparent 62%),
        linear-gradient(180deg, #8ec2e6 0%, #b3d6ee 55%, var(--creme) 100%);
      overflow: hidden;
    }
    .capa-grade { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(32px, 6vw, 80px); align-items: center; padding-bottom: clamp(56px, 8vw, 96px); }
    .capa-selo {
      display: inline-block; background: var(--limao); border: var(--borda); box-shadow: var(--sombra-p);
      border-radius: 14px; padding: 4px 18px 6px; transform: rotate(-3deg);
      font-family: var(--fonte-manuscrita); font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2;
    }
    .capa h1 {
      margin-top: 18px; font-size: clamp(3.2rem, 10vw, 7.6rem); line-height: .88; text-transform: uppercase;
      overflow-wrap: normal;
    }
    .capa-profissao { display: block; margin-top: 14px; font-family: var(--fonte-corpo); font-weight: 700; font-size: clamp(1rem, 2vw, 1.15rem); letter-spacing: .14em; text-transform: uppercase; }
    .capa-frase { margin-top: 22px; font-size: clamp(1.15rem, 2.3vw, 1.4rem); line-height: 1.5; max-width: 560px; font-weight: 500; }
    .capa-botoes { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
    .capa-numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 40px; max-width: 580px; }
    .capa-numeros li { background: var(--branco); border: var(--borda); box-shadow: var(--sombra-p); border-radius: var(--raio-p); padding: 14px 16px; }
    .capa-numeros strong { display: block; font-family: var(--fonte-titulo); font-weight: 400; font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.05; }
    .capa-numeros span { display: block; font-size: .9rem; font-weight: 600; color: var(--tinta-suave); line-height: 1.3; margin-top: 4px; }

    .capa-foto-area { position: relative; padding: 24px 12px 32px; }
    .capa-sol {
      position: absolute; width: 72%; aspect-ratio: 1; right: -6%; top: -4%; border-radius: 50%;
      background: var(--limao); border: var(--borda);
    }
    .capa-foto {
      position: relative; aspect-ratio: 4 / 5; border: var(--borda); border-radius: var(--raio);
      box-shadow: var(--sombra-g); rotate: 2.5deg; background: var(--creme);
    }
    .capa-foto .midia { border-radius: calc(var(--raio) - 3px); }
    .capa-foto-area .adesivo:nth-of-type(1) { left: -4px; bottom: 14%; rotate: -6deg; background: var(--branco); }
    .capa-foto-area .adesivo:nth-of-type(2) { right: -2px; top: 10%; rotate: 5deg; }
    .capa-rabisco { position: absolute; left: -2%; top: -3%; z-index: 4; font-family: var(--fonte-manuscrita); font-size: 2.2rem; color: var(--tinta); rotate: -10deg; }

    /* Faixa de marcas */
    .faixa-marcas { background: var(--tinta); color: var(--limao); border-block: var(--borda); overflow: hidden; }
    .faixa-marcas .container { display: flex; align-items: center; gap: 20px; padding-block: 14px; width: 100%; max-width: none; padding-inline: 20px; }
    .faixa-rotulo { flex: none; font-family: var(--fonte-manuscrita); font-size: 1.7rem; color: var(--creme); line-height: 1; }
    .faixa-janela { overflow: hidden; flex: 1; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
    .faixa-trilho { display: flex; width: max-content; animation: rolar 34s linear infinite; }
    .faixa-marcas:hover .faixa-trilho { animation-play-state: paused; }
    .faixa-trilho ul { display: flex; flex: none; }
    .faixa-trilho li { font-family: var(--fonte-titulo); text-transform: uppercase; font-size: 1rem; letter-spacing: .04em; white-space: nowrap; padding-inline: 22px; position: relative; }
    .faixa-trilho li::after { content: "✺"; position: absolute; right: -8px; color: var(--ceu); }
    @keyframes rolar { to { transform: translateX(-50%); } }

    /* =========================================================
       2. SOBRE MIM
       ========================================================= */
    .sobre-grade { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(40px, 7vw, 96px); align-items: center; }
    .sobre-foto-area { position: relative; padding: 18px; }
    .sobre-foto { position: relative; aspect-ratio: 4 / 5; border: var(--borda); border-radius: var(--raio); box-shadow: var(--sombra-g); rotate: -2.5deg; background: var(--creme); }
    .sobre-foto .midia { border-radius: calc(var(--raio) - 3px); }
    .sobre-foto-area .sobre-mini {
      position: absolute; width: 38%; aspect-ratio: 1; right: -4px; bottom: -10px; z-index: 3;
      border: var(--borda); border-radius: 50%; box-shadow: var(--sombra-p); overflow: hidden; rotate: 6deg;
    }
    .sobre-ola { position: absolute; z-index: 4; left: -6px; top: -6px; font-family: var(--fonte-manuscrita); font-size: 2.4rem; background: var(--ceu); border: var(--borda); box-shadow: var(--sombra-p); border-radius: 16px; padding: 0 18px 4px; rotate: -8deg; }
    .sobre-texto p + p { margin-top: 16px; }
    .sobre-texto .titulo-secao { margin-bottom: 26px; }
    .entregas { margin-top: 30px; background: var(--branco); border: var(--borda); box-shadow: var(--sombra); border-radius: var(--raio); padding: 24px clamp(20px, 3vw, 30px); }
    .entregas h3 { font-size: 1.15rem; text-transform: uppercase; margin-bottom: 14px; }
    .entregas li { display: flex; gap: 12px; align-items: flex-start; padding-block: 7px; font-weight: 500; }
    .entregas li::before {
      content: "✓"; flex: none; width: 26px; height: 26px; display: grid; place-items: center; margin-top: 1px;
      border: 2px solid var(--tinta); border-radius: 50%; background: var(--limao); font-weight: 700; font-size: .85rem;
    }

    /* =========================================================
       3. CONTEÚDOS DE DESTAQUE
       ========================================================= */
    .destaques { background: var(--ceu-claro); border-block: var(--borda); }
    .destaques-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3vw, 36px); }
    .destaque-card {
      display: flex; flex-direction: column; text-decoration: none; background: var(--branco);
      border: var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px 14px 22px;
    }
    .destaque-card:hover { transform: translate(-3px, -3px); box-shadow: var(--sombra-g); }
    .destaque-card:nth-child(1) { rotate: -1.2deg; }
    .destaque-card:nth-child(3) { rotate: 1.2deg; }
    .destaque-capa { position: relative; aspect-ratio: 9 / 16; border: var(--borda); border-radius: 14px; overflow: hidden; }
    .destaque-capa .midia { position: absolute; inset: 0; }
    .play {
      position: absolute; z-index: 2; left: 50%; top: 50%; width: 78px; height: 78px; translate: -50% -50%;
      border-radius: 50%; background: var(--limao); border: var(--borda); box-shadow: var(--sombra-p);
      display: grid; place-items: center; transition: transform .2s ease;
    }
    .play::before { content: ""; margin-left: 6px; border-style: solid; border-width: 13px 0 13px 21px; border-color: transparent transparent transparent var(--tinta); }
    .destaque-card:hover .play { transform: scale(1.08); }
    .destaque-formato { position: absolute; z-index: 2; left: 12px; top: 12px; background: var(--creme); border: 2px solid var(--tinta); border-radius: 999px; padding: 3px 12px; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .destaque-numero { margin-top: 20px; font-family: var(--fonte-titulo); font-size: clamp(2.6rem, 4.6vw, 3.4rem); line-height: 1; }
    .destaque-numero span { background: linear-gradient(transparent 58%, var(--limao) 58% 92%, transparent 92%); padding-inline: 2px; }
    .destaque-rotulo { margin-top: 6px; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--verde-escuro); }
    .destaque-titulo { margin-top: 14px; font-family: var(--fonte-corpo); font-weight: 700; font-size: 1.2rem; line-height: 1.3; }
    .destaque-contexto { margin-top: 6px; font-size: .98rem; color: var(--tinta-suave); line-height: 1.5; }
    .destaque-ver { margin-top: 16px; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

    /* =========================================================
       4. TRABALHOS POR NICHO
       ========================================================= */
    .filtros { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
    .filtro {
      padding: 10px 20px; border: var(--borda); border-radius: 999px; background: var(--branco);
      font-weight: 700; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .filtro:hover { background: var(--ceu-claro); }
    .filtro[aria-pressed="true"] { background: var(--limao); box-shadow: var(--sombra-p); transform: translate(-2px, -2px); }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
    .galeria { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .trabalho {
      display: flex; flex-direction: column; text-decoration: none; background: var(--branco); border: var(--borda);
      border-radius: var(--raio); box-shadow: var(--sombra-p); padding: 10px 10px 16px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .trabalho:hover { transform: translate(-3px, -3px); box-shadow: var(--sombra); }
    .trabalho:hover .play { transform: scale(1.08); }
    .trabalho-midia { position: relative; display: block; background: var(--tinta); }
    .trabalho-midia .midia { position: absolute; inset: 0; }
    .play-p { width: 52px; height: 52px; }
    .play-p::before { border-width: 9px 0 9px 15px; margin-left: 4px; }
    .trabalho-texto { display: block; padding: 12px 4px 0; }
    .filtro-total { display: inline-block; min-width: 1.6em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--tinta); color: var(--limao); font-size: .78rem; line-height: 1.6; text-align: center; }
    .galeria-rodape { margin-top: 36px; text-align: center; }
    .galeria-rodape .btn[hidden] { display: none; }

    /* Player de vídeo */
    .player {
      padding: 0; border: var(--borda); border-radius: var(--raio); background: var(--creme); color: var(--tinta);
      box-shadow: var(--sombra-g); width: min(420px, 92vw, calc((100vh - 150px) * 9 / 16 + 6px)); max-width: none; overflow: hidden;
    }
    .player::backdrop { background: rgba(19, 35, 15, .78); }
    .player-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 18px; border-bottom: var(--borda); background: var(--limao); }
    .player-titulo { font-family: var(--fonte-titulo); text-transform: uppercase; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-fechar { flex: none; width: 40px; height: 40px; border: var(--borda); border-radius: 12px; background: var(--creme); font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    .player-video { aspect-ratio: 9 / 16; background: #000; }
    .player-video iframe { width: 100%; height: 100%; border: 0; display: block; }
    .player-link { display: block; padding: 12px 18px; font-weight: 700; text-align: center; }
    .trabalho[hidden] { display: none; }
    .trabalho.surgir { animation: surgir .45s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .trabalho-midia { aspect-ratio: 9 / 16; border: 2px solid var(--tinta); border-radius: 12px; overflow: hidden; }
        .trabalho-categoria { display: inline-block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; background: var(--ceu-claro); border: 1.5px solid var(--tinta); border-radius: 999px; padding: 2px 10px; }
    .trabalho-titulo { display: block; margin-top: 8px; font-weight: 700; line-height: 1.35; }
    .trabalho-formato { display: block; font-size: .92rem; color: var(--tinta-suave); }

    /* =========================================================
       5. COMO EU TE AJUDO
       ========================================================= */
    .servicos { background: var(--limao); border-block: var(--borda); }
    .servicos .manuscrito { color: var(--tinta); }
    .servicos .subtitulo-secao { color: var(--tinta); }
    .servicos-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 26px; }
    .servico {
      position: relative; background: var(--creme); border: var(--borda); border-radius: var(--raio);
      box-shadow: var(--sombra); padding: 28px 26px;
    }
    .servico:hover { transform: translate(-3px, -3px); box-shadow: var(--sombra-g); }
    .servico-icone { width: 58px; height: 58px; display: grid; place-items: center; border: var(--borda); border-radius: 16px; background: var(--ceu); font-size: 1.6rem; rotate: -4deg; }
    .servico-num { position: absolute; right: 22px; top: 18px; font-family: var(--fonte-titulo); font-size: 2.4rem; color: transparent; -webkit-text-stroke: 1.5px var(--tinta); opacity: .55; }
    .servico h3 { margin-top: 20px; font-size: 1.4rem; text-transform: uppercase; }
    .servico p { margin-top: 10px; color: var(--tinta-suave); }
    .servicos-cta { margin-top: 48px; text-align: center; }

    /* =========================================================
       6. NÚMEROS E DEPOIMENTOS
       ========================================================= */
    .contadores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .contador { border: var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 26px 22px; background: var(--branco); }
    .contador:nth-child(4n+1) { background: var(--limao); }
    .contador:nth-child(4n+2) { background: var(--ceu); }
    .contador:nth-child(4n+3) { background: var(--branco); }
    .contador:nth-child(4n+4) { background: var(--verde); }
    .contador-valor { font-family: var(--fonte-titulo); font-size: clamp(2.6rem, 5vw, 3.6rem); line-height: 1; white-space: nowrap; }
    .contador-rotulo { margin-top: 10px; font-weight: 600; line-height: 1.35; }
    .bloco-titulo { margin-top: clamp(56px, 8vw, 88px); margin-bottom: 28px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; }
    .bloco-titulo h3 { font-size: clamp(1.5rem, 3vw, 2rem); text-transform: uppercase; }
    .bloco-titulo span { font-family: var(--fonte-manuscrita); font-size: 1.9rem; color: var(--verde-escuro); line-height: 1; }
    .resultados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .resultado { background: var(--branco); border: var(--borda); border-radius: var(--raio); padding: 24px; box-shadow: var(--sombra-p); display: flex; flex-direction: column; gap: 8px; }
    .resultado-marca { font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--verde-escuro); }
    .resultado-numero { font-family: var(--fonte-titulo); font-size: clamp(2rem, 3.6vw, 2.6rem); line-height: 1; }
    .resultado-desc { color: var(--tinta-suave); }
    .depoimentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .depoimento { position: relative; margin: 0; background: var(--creme); border: var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 40px 26px 26px; display: flex; flex-direction: column; }
    .depoimento:nth-child(2) { background: var(--ceu-claro); }
    .depoimento::before { content: "\201C"; position: absolute; top: -26px; left: 20px; font-family: var(--fonte-titulo); font-size: 5rem; line-height: 1; color: var(--verde); -webkit-text-stroke: 2px var(--tinta); }
    .depoimento blockquote { margin: 0; font-size: 1.05rem; flex: 1; }
    .depoimento figcaption { margin-top: 20px; padding-top: 16px; border-top: 2px dashed rgba(19,35,15,.35); }
    .depoimento-nome { display: block; font-weight: 700; }
    .depoimento-empresa { display: block; font-size: .95rem; color: var(--tinta-suave); }
    .estrelas { color: var(--verde-escuro); letter-spacing: 3px; margin-bottom: 10px; font-size: 1.05rem; }

    /* =========================================================
       7. BORA CRIAR JUNTOS (contato)
       ========================================================= */
    .contato { background: var(--ceu); border-top: var(--borda); overflow: hidden; }
    .contato::before { content: ""; position: absolute; width: 340px; aspect-ratio: 1; border-radius: 50%; background: var(--limao); border: var(--borda); right: -110px; top: -110px; }
    .contato-grade { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(36px, 6vw, 80px); align-items: start; }
    .contato .manuscrito { color: var(--tinta); }
    .contato-texto .subtitulo-secao { color: var(--tinta); }
    .contato-diretos { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; max-width: 380px; }
    .contato-diretos .btn { justify-content: flex-start; }
    .contato-diretos small { font-weight: 500; opacity: .85; margin-left: auto; }
    .formulario { background: var(--creme); border: var(--borda); border-radius: var(--raio); box-shadow: var(--sombra-g); padding: clamp(24px, 4vw, 38px); rotate: .8deg; }
    .formulario h3 { font-size: 1.5rem; text-transform: uppercase; margin-bottom: 22px; }
    .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .campo label { font-weight: 700; }
    .campo input, .campo textarea {
      width: 100%; padding: 13px 16px; border: var(--borda); border-radius: var(--raio-p); background: var(--branco);
      transition: box-shadow .15s ease;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .campo input:focus, .campo textarea:focus { outline: none; box-shadow: 0 0 0 4px var(--limao), 4px 4px 0 4px var(--tinta); }
    .campo input[aria-invalid="true"], .campo textarea[aria-invalid="true"] { border-color: #a1260f; }
    .erro-campo { color: #8f1f0b; font-size: .92rem; font-weight: 600; min-height: 0; }
    .formulario .btn { width: 100%; margin-top: 4px; }
    .form-aviso { margin-top: 16px; padding: 14px 16px; border: var(--borda); border-radius: var(--raio-p); background: var(--limao); font-weight: 600; }
    .form-aviso[hidden] { display: none; }

    /* =========================================================
       8. RODAPÉ
       ========================================================= */
    .rodape { background: var(--tinta); color: var(--creme); padding-block: 56px 32px; }
    .rodape-topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 32px; border-bottom: 1.5px solid rgba(246,244,230,.25); }
    .rodape .logo { font-size: 1.6rem; color: var(--creme); }
    .rodape .logo span { color: var(--limao); }
    .rodape-redes { display: flex; flex-wrap: wrap; gap: 10px; }
    .rodape-redes a { display: inline-block; padding: 9px 18px; border: 2px solid var(--limao); border-radius: 999px; color: var(--limao); text-decoration: none; font-weight: 700; transition: background-color .15s ease, color .15s ease; }
    .rodape-redes a:hover { background: var(--limao); color: var(--tinta); }
    .rodape :focus-visible { outline-color: var(--limao); box-shadow: none; }
    .rodape-base { padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: .95rem; color: rgba(246,244,230,.82); }
    .rodape-base a { color: var(--limao); }

    /* =========================================================
       ANIMAÇÃO DE ENTRADA (fade com subidinha)
       ========================================================= */
    .js .reveal { opacity: 0; translate: 0 26px; }
    .js .reveal {
      transition: opacity .75s ease var(--atraso, 0s), translate .75s cubic-bezier(.2,.7,.2,1) var(--atraso, 0s),
                  transform .2s ease, box-shadow .2s ease;
    }
    .js .reveal.visivel { opacity: 1; translate: 0 0; }
    .destaque-card, .servico { transition: transform .2s ease, box-shadow .2s ease; }

    /* =========================================================
       RESPONSIVO
       ========================================================= */
    @media (max-width: 1020px) {
      .contadores { grid-template-columns: repeat(2, 1fr); }
      .resultados, .depoimentos { grid-template-columns: 1fr 1fr; }
      .depoimentos .depoimento:last-child, .resultados .resultado:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 900px) {
      .menu-botao { display: inline-flex; }
      .nav-lista {
        position: fixed; top: var(--altura-menu); left: 0; right: 0;
        flex-direction: column; align-items: stretch; gap: 4px;
        padding: 16px 20px 24px; background: var(--creme); border-bottom: var(--borda);
        box-shadow: 0 10px 0 rgba(19,35,15,.08);
        visibility: hidden; opacity: 0; transform: translateY(-10px);
        transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
        max-height: calc(100vh - var(--altura-menu)); overflow-y: auto;
      }
      .nav-lista.aberto { visibility: visible; opacity: 1; transform: none; transition: opacity .2s ease, transform .2s ease; }
      .nav-lista a { padding: 14px 16px; font-size: 1.15rem; border-radius: 14px; }
      .nav-lista a.nav-cta { margin: 10px 0 0; text-align: center; }

      .capa-grade, .sobre-grade, .contato-grade { grid-template-columns: 1fr; }
      .capa-foto-area { max-width: 440px; width: 100%; margin-inline: auto; }
      .sobre-foto-area { max-width: 440px; width: 100%; margin-inline: auto; }
      .destaques-grade { grid-template-columns: 1fr; max-width: 400px; margin-inline: auto; }
      .destaque-card:nth-child(n) { rotate: 0deg; }
      .formulario { rotate: 0deg; }
    }
    @media (max-width: 620px) {
      body { font-size: 1rem; }
      .capa-numeros { gap: 10px; }
      .capa-numeros li { padding: 12px 10px; }
      .capa-numeros span { font-size: .8rem; }
      .capa-botoes .btn { flex: 1 1 100%; }
      .contadores, .resultados, .depoimentos { grid-template-columns: 1fr; }
      .depoimentos .depoimento:last-child, .resultados .resultado:last-child { grid-column: auto; }
      .galeria { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .trabalho { padding: 7px 7px 12px; }
      .trabalho-texto { padding: 10px 2px 0; }
      .play-p { width: 42px; height: 42px; }
      .trabalho-titulo { font-size: .95rem; }
      .trabalho-formato { font-size: .85rem; }
      .filtros {
        gap: 8px; flex-wrap: nowrap; overflow-x: auto; margin-inline: -20px; padding: 4px 20px 10px;
        scroll-snap-type: x proximity; scrollbar-width: none;
      }
      .filtros::-webkit-scrollbar { display: none; }
      .filtro { padding: 9px 16px; flex: none; scroll-snap-align: start; white-space: nowrap; }
      .faixa-rotulo { display: none; }
      .contato-diretos { max-width: none; }
      .contato::before { width: 180px; right: -80px; top: -80px; }
      .logo { font-size: 1.1rem; }
      .logo span { font-size: 1.35rem; }
    }
    @media (max-width: 340px) {
      .galeria { grid-template-columns: 1fr; }
      .capa-numeros { grid-template-columns: 1fr; }
    }

    /* Respeita quem prefere menos movimento */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .faixa-trilho { animation: none; flex-wrap: wrap; width: auto; }
      .faixa-trilho ul[aria-hidden="true"] { display: none; }
      .faixa-trilho ul { flex-wrap: wrap; }
      .js .reveal { opacity: 1; translate: 0 0; }
    }
  </style>
</head>
<body>
  <a class="pular-link" href="#conteudo">Pular para o conteúdo</a>

  <!-- ========== 1. CAPA: MENU FIXO ========== -->
  <header class="topo">
    <div class="container">

  <main id="conteudo">

          <span class="capa-selo" id="capa-saudacao"></span>
          <h1 id="capa-titulo" data-ajustar></h1>

        </div>
        <div class="capa-foto-area reveal" style="--atraso:.15s">

      <div class="faixa-marcas">

          <span class="faixa-rotulo" id="faixa-rotulo"></span>

          <div class="entregas">

            <ul id="sobre-entregas"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 3. CONTEÚDOS DE DESTAQUE ========== -->
    <section class="destaques" id="destaques" aria-labelledby="destaques-titulo">

          <span class="manuscrito" id="destaques-manuscrito"></span>
          <h2 class="titulo-secao" id="destaques-titulo"></h2>
          <p class="subtitulo-secao" id="destaques-subtitulo"></p>
        </div>
        <div class="destaques-grade" id="destaques-grade"></div>
      </div>
    </section>

    <!-- ========== 4. TRABALHOS POR NICHO ========== -->

      <div class="container">
        <div class="cabecalho-secao reveal">
          <span class="manuscrito" id="trabalhos-manuscrito"></span>
          <h2 class="titulo-secao" id="trabalhos-titulo"></h2>
          <p class="subtitulo-secao" id="trabalhos-subtitulo"></p>
        </div>
        <div class="filtros reveal" id="filtros" role="group" aria-label="Filtrar trabalhos por nicho"></div>

      </div>

    <!-- ========== 5. COMO EU TE AJUDO ========== -->
    <section class="servicos" id="servicos" aria-labelledby="servicos-titulo">
      <div class="container">
        <div class="cabecalho-secao reveal">
          <span class="manuscrito" id="servicos-manuscrito"></span>

          <span id="depoimentos-manuscrito"></span>

    <!-- ========== 7. BORA CRIAR JUNTOS ========== -->

  <script>
  /* =================================================================
     CONFIGURAÇÃO DO SITE
     Tudo o que aparece escrito no site está aqui embaixo.
     Edite só os textos entre aspas. Não apague vírgulas, chaves { }
     nem colchetes [ ], eles fazem parte da estrutura.

     COMO TROCAR UM BLOCO EM GRADIENTE POR UMA FOTO REAL:
     Todo item com foto ou capa tem três campos:
       gradiente: a cor do bloco de exemplo (g-limao, g-ceu, g-verde,
                  g-sol, g-mar, g-creme, g-brisa ou g-pomar)
       imagem:    deixe '' (vazio) para usar o gradiente. Para usar uma
                  foto, coloque o caminho dela, por exemplo
                  'fotos/minha-foto.jpg' (arquivo na mesma pasta do site,
                  dentro de uma pasta chamada fotos) ou um link completo
                  'https://...'. A foto aparece no lugar do gradiente.
       alt:       descrição da foto para leitores de tela. Descreva o
                  que aparece na imagem.
     ================================================================= */
  const CONFIG = {

    // EDITE AQUI: seu nome e sua profissão (aparecem no menu, na capa e no rodapé)
    marca: {
      nome: 'Lara Dam',
      profissao: 'Criadora de conteúdo UGC',
      detalheLogo: 'ugc' // palavrinha manuscrita ao lado do nome no menu
    },

    // EDITE AQUI: os nomes dos links do menu (a ordem segue as seções)
    menu: [
      { texto: 'Sobre', destino: '#sobre' },
      { texto: 'Destaques', destino: '#destaques' },
      { texto: 'Trabalhos', destino: '#trabalhos' },
      { texto: 'Serviços', destino: '#servicos' },
      { texto: 'Números', destino: '#numeros' },
      { texto: 'Contato', destino: '#contato', destaque: true }
    ],

    // EDITE AQUI: a capa (primeira tela do site)
    capa: {
      saudacao: 'oi, marca!',
      frase: 'Eu crio vídeos que parecem conversa de amiga e vendem como anúncio. Seu produto ganha uma história real, gera confiança na hora e faz o público clicar.',
      botaoContato: 'Falar comigo',
      botaoTrabalhos: 'Ver os trabalhos',
      rabisco: 'uau!',

  // Cria uma foto real (se houver imagem) ou o bloco em gradiente
  function idYoutube(link) {
    const r = String(link || '').match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{11})/);
    return r ? r[1] : '';
  }
  function midia(m, link) {
    const id = idYoutube(link);
    if (!m.imagem && id) return `<img class="midia" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="${esc(m.alt)}" loading="lazy">`;
    if (m.imagem) return `<img class="midia" src="${esc(m.imagem)}" alt="${esc(m.alt)}" loading="lazy">`;
    return `<div class="midia ${esc(m.gradiente || 'g-limao')}" role="img" aria-label="${esc(m.alt)}"></div>`;
  }

    texto('faixa-rotulo', c.marcas.rotulo);
    const itensMarcas = c.marcas.lista.map((m) => `<li>${esc(m)}</li>`).join('');
    $('faixa-trilho').innerHTML =
      `<ul aria-label="Marcas atendidas">${itensMarcas}</ul><ul aria-hidden="true">${itensMarcas}</ul>`;

    // Sobre
    texto('sobre-ola', c.sobre.ola);
    texto('sobre-manuscrito', c.sobre.manuscrito);
    texto('sobre-titulo', c.sobre.titulo);
    $('sobre-paragrafos').innerHTML = c.sobre.paragrafos.map((p) => `<p>${esc(p)}</p>`).join('');
    texto('sobre-entregas-titulo', c.sobre.entregasTitulo);
    $('sobre-entregas').innerHTML = c.sobre.entregas.map((e) => `<li>${esc(e)}</li>`).join('');
    $('sobre-foto').innerHTML = midia(c.sobre.foto);
    $('sobre-mini').innerHTML = midia(c.sobre.fotoMini);

    // Destaques
    texto('destaques-manuscrito', c.destaques.manuscrito);
    texto('destaques-titulo', c.destaques.titulo);
    texto('destaques-subtitulo', c.destaques.subtitulo);
    $('destaques-grade').innerHTML = c.destaques.itens.map((d, i) => `
      <a class="destaque-card reveal" style="--atraso:${i * 0.12}s" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer" data-video="${esc(d.link)}" data-titulo="${esc(d.titulo)}">
        <div class="destaque-capa">
          ${midia(d.capa, d.link)}
          <span class="destaque-formato">${esc(d.formato)}</span>
          <span class="play" aria-hidden="true"></span>
        </div>
        <p class="destaque-numero"><span>${esc(d.numero)}</span></p>
        <p class="destaque-rotulo">${esc(d.rotulo)}</p>
        <h3 class="destaque-titulo">${esc(d.titulo)}</h3>
        <p class="destaque-contexto">${esc(d.contexto)}</p>
        <span class="destaque-ver">Assistir ao vídeo →</span>
      </a>`).join('');

    // Trabalhos
    texto('trabalhos-manuscrito', c.trabalhos.manuscrito);
    texto('trabalhos-titulo', c.trabalhos.titulo);
    texto('trabalhos-subtitulo', c.trabalhos.subtitulo);
    const todosVideos = c.trabalhos.nichos.flatMap((n) => n.videos.map((v) => ({ ...v, nicho: n.nome })));
    const filtros = [{ nome: c.trabalhos.textoTodos, valor: 'todos', total: todosVideos.length }]
      .concat(c.trabalhos.nichos.map((n) => ({ nome: n.nome, valor: n.nome, total: n.videos.length })));
    $('filtros').innerHTML = filtros.map((f, i) =>
      `<button type="button" class="filtro" data-filtro="${esc(f.valor)}" aria-pressed="${i === 0}">${esc(f.nome)} <span class="filtro-total">${f.total}</span></button>`).join('');
    $('galeria').innerHTML = todosVideos.map((v) => `
      <a class="trabalho" href="${esc(v.link)}" target="_blank" rel="noopener noreferrer" data-categoria="${esc(v.nicho)}" data-video="${esc(v.link)}" data-titulo="${esc(v.marca)}">
        <span class="trabalho-midia">
          ${midia({ gradiente: 'g-limao', imagem: '', alt: '' }, v.link)}
          <span class="play play-p" aria-hidden="true"></span>
        </span>
        <span class="trabalho-texto">
          <span class="trabalho-categoria">${esc(v.nicho)}</span>
          <span class="trabalho-titulo">${esc(v.marca)}</span>
          <span class="trabalho-formato">${esc(v.detalhe || 'Assistir ao vídeo')}</span>
        </span>
      </a>`).join('');
    texto('galeria-mais', c.trabalhos.textoMais);

    // Serviços
    texto('servicos-manuscrito', c.servicos.manuscrito);
    texto('servicos-titulo', c.servicos.titulo);
    texto('servicos-subtitulo', c.servicos.subtitulo);
    texto('servicos-btn', c.servicos.botao);
    $('servicos-grade').innerHTML = c.servicos.itens.map((s, i) => `
      <article class="servico reveal" style="--atraso:${(i % 3) * 0.1}s">
        <span class="servico-num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
        <div class="servico-icone" aria-hidden="true">${esc(s.icone)}</div>
        <h3>${esc(s.titulo)}</h3>
        <p>${esc(s.descricao)}</p>
      </article>`).join('');

    // Números, resultados e depoimentos
    const n = c.numeros;
    texto('numeros-manuscrito', n.manuscrito);
    texto('numeros-titulo', n.titulo);
    $('contadores').innerHTML = n.contadores.map((k, i) => `
      <li class="contador reveal" style="--atraso:${i * 0.1}s">
        <p class="contador-valor" data-valor="${k.valor}" data-decimais="${k.decimais || 0}"
           data-prefixo="${esc(k.prefixo || '')}" data-sufixo="${esc(k.sufixo || '')}">${esc(k.prefixo || '')}${formatar(k.valor, k.decimais || 0)}${esc(k.sufixo || '')}</p>
        <p class="contador-rotulo">${esc(k.rotulo)}</p>
      </li>`).join('');
    texto('resultados-titulo', n.resultadosTitulo);
    texto('resultados-manuscrito', n.resultadosManuscrito);
    $('resultados').innerHTML = n.resultados.map((r, i) => `
      <article class="resultado reveal" style="--atraso:${i * 0.1}s">
        <span class="resultado-marca">${esc(r.marca)}</span>
        <p class="resultado-numero">${esc(r.numero)}</p>
        <p class="resultado-desc">${esc(r.descricao)}</p>
      </article>`).join('');
    texto('depoimentos-titulo', n.depoimentosTitulo);
    texto('depoimentos-manuscrito', n.depoimentosManuscrito);
    $('depoimentos').innerHTML = n.depoimentos.map((d, i) => `
      <figure class="depoimento reveal" style="--atraso:${i * 0.1}s">
        <p class="estrelas" aria-label="Avaliação 5 de 5 estrelas">★★★★★</p>
        <blockquote><p>${esc(d.texto)}</p></blockquote>
        <figcaption>
          <span class="depoimento-nome">${esc(d.nome)}</span>
          <span class="depoimento-empresa">${esc(d.empresa)}</span>
        </figcaption>
      </figure>`).join('');

    // Contato
    const ct = c.contato;
    texto('contato-manuscrito', ct.manuscrito);
    texto('contato-titulo', ct.titulo);
    texto('contato-texto', ct.texto);
    texto('form-titulo', ct.formTitulo);
    texto('form-botao', ct.formBotao);
    let numero = ct.whatsapp.replace(/\D/g, '');
    if (numero.length <= 11) numero = '55' + numero;
    const linkWhats = `https://wa.me/${numero}?text=${encodeURIComponent(ct.mensagemWhatsapp)}`;
    const usuarioInsta = ct.instagram.replace('@', '');
    $('contato-diretos').innerHTML = `
      <a class="btn btn-limao" href="${esc(linkWhats)}" target="_blank" rel="noopener noreferrer">${icones.whatsapp} WhatsApp <small>${esc(ct.whatsapp)}</small></a>
      <a class="btn" href="mailto:${esc(ct.email)}">${icones.email} E-mail <small>${esc(ct.email)}</small></a>
      <a class="btn" href="https://instagram.com/${esc(usuarioInsta)}" target="_blank" rel="noopener noreferrer">${icones.instagram} Instagram <small>${esc(ct.instagram)}</small></a>`;

    // Rodapé
    $('rodape-redes').innerHTML = c.redes.map((r) =>
      `<li><a href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">${esc(r.nome)}</a></li>`).join('');
    texto('rodape-direitos', `© ${new Date().getFullYear()} ${c.marca.nome}. ${c.rodape}`);
  }

  function formatar(valor, decimais) {
    return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: decimais, maximumFractionDigits: decimais });
  }

  // Menu sanduíche no celular
  function iniciarMenu() {
    const botao = $('menu-botao');
    const lista = $('nav-lista');
    const rotulo = botao.querySelector('.visualmente-oculto');
    const alternar = (abrir) => {
      botao.setAttribute('aria-expanded', String(abrir));
      lista.classList.toggle('aberto', abrir);
      rotulo.textContent = abrir ? 'Fechar menu' : 'Abrir menu';
    };
    botao.addEventListener('click', () => alternar(botao.getAttribute('aria-expanded') !== 'true'));
    lista.addEventListener('click', (e) => { if (e.target.closest('a')) alternar(false); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && botao.getAttribute('aria-expanded') === 'true') { alternar(false); botao.focus(); }
    });
    window.addEventListener('resize', () => { if (window.innerWidth > 900) alternar(false); });
  }

  // Filtros da galeria e botão "Ver mais vídeos"
  function iniciarFiltros() {
    const botoes = document.querySelectorAll('.filtro');
    const itens = [...document.querySelectorAll('.trabalho')];
    const botaoMais = $('galeria-mais');
    const porPagina = CONFIG.trabalhos.porPagina || 12;
    let filtro = 'todos';
    let limite = porPagina;

    const mostrar = (animar) => {
      const doFiltro = itens.filter((item) => filtro === 'todos' || item.dataset.categoria === filtro);
      itens.forEach((item) => { item.hidden = true; item.classList.remove('surgir'); });
      doFiltro.forEach((item, i) => {
        if (i >= limite) return;
        item.hidden = false;
        if (animar) { void item.offsetWidth; item.classList.add('surgir'); }
      });
      const faltam = doFiltro.length - limite;
      botaoMais.hidden = faltam <= 0;
      botaoMais.textContent = `${CONFIG.trabalhos.textoMais} (${faltam})`;
      return doFiltro.length;
    };

    botoes.forEach((b) => b.addEventListener('click', () => {
      filtro = b.dataset.filtro;
      limite = porPagina;
      botoes.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const total = mostrar(true);
      texto('galeria-status', `${total} vídeos em ${b.firstChild.textContent.trim()}.`);
    }));
    botaoMais.addEventListener('click', () => {
      const primeiroNovo = limite;
      limite += porPagina;
      mostrar(false);
      const visiveis = itens.filter((item) => !item.hidden);
      visiveis.slice(primeiroNovo).forEach((item) => { void item.offsetWidth; item.classList.add('surgir'); });
      if (visiveis[primeiroNovo]) visiveis[primeiroNovo].focus({ preventScroll: true });
    });
    mostrar(false);
  }

  // Player de vídeo dentro do site
  function iniciarPlayer() {
    const dialogo = $('player');
    const moldura = $('player-video');
    const linkFora = $('player-link');
    if (!dialogo || typeof dialogo.showModal !== 'function') return; // navegador antigo: o link abre no YouTube
    let origem = null;
    const fechar = () => dialogo.close();
    dialogo.addEventListener('close', () => { moldura.innerHTML = ''; if (origem) origem.focus(); });
    dialogo.addEventListener('click', (e) => { if (e.target === dialogo) fechar(); });
    $('player-fechar').addEventListener('click', fechar);
    document.addEventListener('click', (e) => {
      const card = e.target.closest('[data-video]');
      if (!card || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const id = idYoutube(card.dataset.video);
      if (!id) return;
      e.preventDefault();
      origem = card;
      texto('player-titulo', card.dataset.titulo || 'Vídeo');
      linkFora.href = card.dataset.video;
      moldura.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1" title="Vídeo: ${esc(card.dataset.titulo || '')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      dialogo.showModal();
    });
  }

  // Animação de entrada e contadores
  const menosMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animarContador(el) {
    const alvo = parseFloat(el.dataset.valor);
    const dec = parseInt(el.dataset.decimais, 10);
    const pre = el.dataset.prefixo;
    const suf = el.dataset.sufixo;
    if (menosMovimento) return;
    const duracao = 1700;
    const inicio = performance.now();
    const passo = (agora) => {
      const p = Math.min((agora - inicio) / duracao, 1);
      const suave = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + formatar(alvo * suave, dec) + suf;
      if (p < 1) requestAnimationFrame(passo);
    };
    el.textContent = pre + formatar(0, dec) + suf;
    requestAnimationFrame(passo);
  }

  function iniciarAnimacoes() {
    const elementos = document.querySelectorAll('.reveal');
    const contadores = document.querySelectorAll('.contador-valor');
    if (!('IntersectionObserver' in window)) {
      elementos.forEach((el) => el.classList.add('visivel'));
      return;
    }
    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach((entrada) => {
        if (entrada.isIntersecting) {
          entrada.target.classList.add('visivel');
          observador.unobserve(entrada.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    elementos.forEach((el) => observador.observe(el));

    const observadorNumeros = new IntersectionObserver((entradas) => {
      entradas.forEach((entrada) => {
        if (entrada.isIntersecting) {
          animarContador(entrada.target);
          observadorNumeros.unobserve(entrada.target);
        }
      });
    }, { threshold: 0.6 });
    contadores.forEach((el) => observadorNumeros.observe(el));
  }

  // Formulário de contato
  function iniciarFormulario() {
    const form = $('formulario');
    const aviso = $('form-aviso');
    const campos = [
      { el: $('f-nome'), erro: $('erro-nome'), msg: 'Escreva o seu nome.' },
      { el: $('f-email'), erro: $('erro-email'), msg: 'Escreva um e-mail válido, por exemplo nome@marca.com.' },
      { el: $('f-mensagem'), erro: $('erro-mensagem'), msg: 'Conte um pouquinho sobre o que você precisa.' }
    ];
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let primeiroErro = null;
      campos.forEach((c) => {
        const valido = c.el.value.trim() !== '' && c.el.checkValidity();
        c.el.setAttribute('aria-invalid', String(!valido));
        c.erro.textContent = valido ? '' : c.msg;
        if (!valido && !primeiroErro) primeiroErro = c.el;
      });
      if (primeiroErro) { primeiroErro.focus(); return; }

      const ct = CONFIG.contato;
      const nome = $('f-nome').value.trim();
      const email = $('f-email').value.trim();
      const mensagem = $('f-mensagem').value.trim();
      if (ct.formModo === 'mailto') {
        const corpo = `Nome: ${nome}\nE-mail: ${email}\n\n${mensagem}`;
        window.location.href = `mailto:${ct.email}?subject=${encodeURIComponent(ct.formAssunto)}&body=${encodeURIComponent(corpo)}`;
        aviso.textContent = ct.formSucesso;
      } else {
        aviso.textContent = `Obrigada, ${nome}! Recebi a sua mensagem e respondo em até 24 horas.`;
      }
      aviso.hidden = false;
      form.reset();
      campos.forEach((c) => c.el.removeAttribute('aria-invalid'));
    });
  }

  // Diminui o título só o necessário para nenhuma palavra do nome quebrar no meio
  function ajustarTitulos() {
    document.querySelectorAll('[data-ajustar]').forEach((el) => {
      el.style.fontSize = '';
      let tamanho = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && tamanho > 20) {
        tamanho *= 0.95;
        el.style.fontSize = tamanho + 'px';
      }
    });
  }

  montarSite();
  iniciarMenu();
  iniciarFiltros();
  iniciarPlayer();
  iniciarAnimacoes();
  iniciarFormulario();
  ajustarTitulos();
  if (document.fonts) document.fonts.ready.then(ajustarTitulos);
  window.addEventListener('resize', ajustarTitulos);
  </script>
